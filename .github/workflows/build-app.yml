name: Build APP

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

env:
  CORE_TAG: "1.16.2"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout app (ZerotierFix + TCP proxy patch)
        uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Checkout ZeroTier core 1.16.2
        run: |
          mkdir -p externals/core
          curl -sSL "https://github.com/zerotier/ZeroTierOne/archive/refs/tags/${CORE_TAG}.tar.gz" | tar -xz -C externals/core --strip-components=1
          curl -sSL "https://raw.githubusercontent.com/sffxzzp/ZerotierFix-Build/main/CMakeLists.txt" -o externals/core/java/CMakeLists.txt
          ls externals/core | head

      - name: Setup Android SDK
        run: |
          SDK=/opt/android-sdk
          mkdir -p $SDK/cmdline-tools
          VER=$(curl -sSL https://dl.google.com/android/repository/repository2-3.xml | grep -oE 'commandlinetools-linux-[0-9]+_latest\.zip' | grep -oE '[0-9]+' | sort -n | tail -1)
          echo "cmdline-tools version: $VER"
          curl -sSL -o /tmp/clt.zip "https://dl.google.com/android/repository/commandlinetools-linux-${VER}_latest.zip"
          unzip -q /tmp/clt.zip -d /tmp/clt
          mv /tmp/clt/cmdline-tools $SDK/cmdline-tools/latest
          export PATH="$SDK/cmdline-tools/latest/bin:$PATH"
          echo "$SDK/cmdline-tools/latest/bin" >> $GITHUB_PATH
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2" "ndk;25.1.8937393" "cmake;3.22.1" > /dev/null

      - name: Build debug APK
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
